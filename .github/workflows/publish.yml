name: Publish

on:
  push:
    branches: [master]
    paths:
      - "meditations/**/*.md"
      - "logs/**"
      - "write.sh"
      - "scripts/**"
      - "requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - "embedding.json"
      - "accounts.json"
      - "blog.sqlite"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/publish.yml"
      - "CNAME"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install search build dependencies
        run: npm ci
      - name: Install publishing dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Check committed embedding freshness
        run: python3 scripts/embed.py --check
      - name: Run state and PCA regressions
        run: python3 -m unittest discover -s tests -v
      - name: Run lexical search regressions
        run: npm test
      - name: Build site and public SQLite snapshot
        run: python3 scripts/publish.py
      # yamllint disable-line rule:line-length
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deploy
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
